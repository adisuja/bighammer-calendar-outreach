<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BigHammer.ai · Cold calendar outreach · Gmail + Google Calendar iOS preview</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="core.css?v=2">
<link rel="stylesheet" href="gmail.css?v=2">
<link rel="stylesheet" href="gcal.css?v=2">
<link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark gcal-mark"><svg width="22" height="22" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3" fill="#fff" stroke="#4285f4" stroke-width="2"/><path d="M3 9h18" stroke="#4285f4" stroke-width="2"/><text x="12" y="18.5" text-anchor="middle" font-size="9" font-weight="700" fill="#1a73e8">15</text></svg></span><span style="display:none"><path fill="#4285f4" d="M1.6 18h3.8V8.7L0 4.6v11.8C0 17.3.7 18 1.6 18z"/><path fill="#34a853" d="M18.6 18h3.8c.9 0 1.6-.7 1.6-1.6V4.6l-5.4 4.1z"/><path fill="#fbbc04" d="M18.6 1.6v7.1L24 4.6V2.4c0-2-2.3-3.2-3.9-2z"/><path fill="#ea4335" d="M5.4 8.7V1.6L12 6.6l6.6-5V8.7L12 13.6z"/><path fill="#c5221f" d="M0 2.4v2.2l5.4 4.1V1.6L3.9.4C2.3-.8 0 .4 0 2.4z"/></svg></span>
    <div>
      <div class="brand-title">BigHammer.ai · Cold calendar outreach</div>
      <div class="brand-sub">Every invite rendered as the recipient sees it: the email in Gmail for iOS, then the event in Google Calendar for iOS</div>
    </div>
  </div>
  <div class="controls">
    <div class="seg" title="Opened conversation, or the inbox list row the email creates">
      <button data-set="view" data-val="opened" class="on">Opened</button>
      <button data-set="view" data-val="inbox">Inbox row</button>
    </div>
    <div class="seg" title="Show sample merge values or the raw {{tokens}}">
      <button data-set="mode" data-val="sample" class="on">Sample data</button>
      <button data-set="mode" data-val="raw">{{tokens}}</button>
    </div>
    <label class="tgl" title="Show the invitation card Gmail builds from the .ics"><input type="checkbox" data-set="preview" checked><span>Invite card</span></label>
    <div class="seg" title="Phone size">
      <button data-set="scale" data-val="1">100%</button>
      <button data-set="scale" data-val="0.85" class="on">85%</button>
      <button data-set="scale" data-val="0.7">70%</button>
    </div>
  </div>
</header>
<div class="layout">
  <nav class="sidenav" id="sidenav" aria-label="Sequences"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast">Copied</div>
<script src="core.js?v=2"></script>
<script src="gmail.js?v=2"></script>
<script src="gcal.js?v=2"></script>
<script src="data.js?v=2"></script>
<script src="app.js?v=2"></script>
</body>
</html>
